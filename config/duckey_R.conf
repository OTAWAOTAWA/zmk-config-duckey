CONFIG_ZMK_KEYBOARD_NAME="Duckey"

# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Battery
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Trackball PMW3610 settings (badjeff driver)
CONFIG_PMW3610_ALT_CPI=700
CONFIG_PMW3610_ALT_CPI_DIVIDOR=1
CONFIG_PMW3610_ALT_ORIENTATION_0=y
CONFIG_PMW3610_ALT_SCROLL_TICK=32
CONFIG_PMW3610_ALT_INVERT_X=n
CONFIG_PMW3610_ALT_INVERT_SCROLL_X=n
CONFIG_PMW3610_ALT_INVERT_SCROLL_Y=y
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_ALT_POLLING_RATE_125_SW=y
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y
